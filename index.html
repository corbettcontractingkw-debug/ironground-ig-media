<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#021127">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IG Posts">
<title>Ironground posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#021127; --panel:#0a1d3a; --line:#1c3256; --silver:#c9d1dc; --dim:#8a97ab; --white:#f4f6f9; --go:#e9edf3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--navy); color:var(--white); font-family:Inter,system-ui,sans-serif; -webkit-text-size-adjust:100%; }
  header { padding:22px 16px 10px; text-align:center; }
  h1 { font-family:Cinzel,serif; font-size:22px; letter-spacing:.14em; margin:0; background:linear-gradient(180deg,#fff,#9aa7b8); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { margin:6px 0 0; color:var(--dim); font-size:13px; }
  main { max-width:560px; margin:0 auto; padding:8px 16px 60px; }
  .post { background:var(--panel); border:1px solid var(--line); border-radius:14px; margin:16px 0; overflow:hidden; }
  .post h2 { font-family:Cinzel,serif; font-size:17px; letter-spacing:.06em; margin:0; padding:14px 16px 4px; color:var(--silver); }
  .meta { padding:0 16px 10px; color:var(--dim); font-size:12px; }
  .strip { display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x mandatory; padding:0 16px 12px; -webkit-overflow-scrolling:touch; }
  .strip figure { margin:0; flex:0 0 62%; scroll-snap-align:center; position:relative; }
  .strip img, .strip video { width:100%; display:block; border-radius:8px; background:#000; }
  .strip figcaption { position:absolute; top:6px; left:6px; background:rgba(2,17,39,.8); color:#fff; font-size:11px; font-weight:600; padding:2px 7px; border-radius:20px; }
  pre { margin:0 16px 12px; padding:12px; background:var(--navy); border:1px solid var(--line); border-radius:10px; white-space:pre-wrap; word-wrap:break-word; font-family:Inter,system-ui,sans-serif; font-size:14px; line-height:1.45; color:var(--white); }
  .btns { display:grid; gap:8px; padding:0 16px 16px; }
  button, a.btn { appearance:none; border:0; border-radius:10px; padding:15px 12px; font:600 15px Inter,system-ui,sans-serif; cursor:pointer; text-align:center; text-decoration:none; display:block; }
  .primary { background:linear-gradient(180deg,#fff,#b9c3d1); color:var(--navy); }
  .primary[disabled] { opacity:.5; }
  .ghost { background:transparent; color:var(--silver); border:1px solid var(--line); }
  .steps { margin:0 16px 14px; padding:0 0 0 18px; color:var(--dim); font-size:13px; line-height:1.5; }
  .saves { display:none; padding:0 16px 16px; gap:6px; flex-wrap:wrap; }
  .saves a { color:var(--silver); font-size:13px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; text-decoration:none; }
  .empty { text-align:center; color:var(--dim); padding:60px 20px; font-size:15px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#fff; color:var(--navy); padding:10px 16px; border-radius:24px; font-size:14px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>IRONGROUND</h1>
  <p>Posts ready for Instagram</p>
</header>
<main id="list"><div class="empty">Loading</div></main>
<div class="toast" id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const blobs = {};   // slug -> array of File objects, fetched ahead so the share tap is instant

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }

async function copyCaption(text) {
  try { await navigator.clipboard.writeText(text); toast("Caption copied"); return true; }
  catch { // older browsers
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); toast(ok ? "Caption copied" : "Press and hold the caption to copy"); return ok;
  }
}

async function preload(post, btn) {
  try {
    const files = [];
    for (const m of post.media) {
      const res = await fetch(`posts/${post.slug}/${m.file}`);
      const blob = await res.blob();
      const type = m.type === "video" ? (m.file.endsWith(".mov") ? "video/quicktime" : "video/mp4") : "image/jpeg";
      files.push(new File([blob], `${post.slug}-${m.file}`, { type }));
    }
    blobs[post.slug] = files;
    if (navigator.canShare && navigator.canShare({ files })) { btn.disabled = false; btn.textContent = `Send ${files.length} to Instagram`; }
    else showSaves(post, btn);
  } catch { showSaves(post, btn); }
}

function showSaves(post, btn) {
  btn.style.display = "none";
  const box = btn.closest(".post").querySelector(".saves");
  box.style.display = "flex";
  box.innerHTML = post.media.map((m, i) => `<a href="posts/${post.slug}/${m.file}" download="${post.slug}-${m.file}">Save ${i + 1}</a>`).join("");
}

async function send(post) {
  const files = blobs[post.slug];
  navigator.clipboard?.writeText(post.caption).catch(() => {});   // caption rides along on the clipboard
  try { await navigator.share({ files }); }
  catch (e) { if (e.name !== "AbortError") toast("Share did not open. Use the Save buttons."); }
}

function render(posts) {
  const list = $("#list");
  if (!posts.length) { list.innerHTML = '<div class="empty">Nothing waiting. Send Claude photos and the next post shows up here.</div>'; return; }
  list.innerHTML = "";
  for (const post of posts) {
    const el = document.createElement("section");
    el.className = "post"; el.id = post.slug;
    const made = new Date(post.made).toLocaleDateString("en-CA", { month: "short", day: "numeric" });
    el.innerHTML = `
      <h2></h2>
      <div class="meta">${post.media.length} items, ${post.shape}, made ${made}</div>
      <div class="strip">${post.media.map((m, i) => `<figure>${m.type === "video"
        ? `<video src="posts/${post.slug}/${m.file}" controls playsinline preload="metadata"></video>`
        : `<img src="posts/${post.slug}/${m.file}" alt="Photo ${i + 1}" loading="lazy">`}<figcaption>${i + 1}</figcaption></figure>`).join("")}</div>
      <pre></pre>
      <div class="btns">
        <button class="primary share" disabled>Getting photos ready</button>
        <button class="ghost copy">Copy caption</button>
      </div>
      <div class="saves"></div>
      <ol class="steps"><li>Tap Send, pick Instagram, then Feed.</li><li>Paste the caption. It is already copied.</li><li>Add your song and tags, then share.</li></ol>`;
    $("h2", el).textContent = post.name;
    $("pre", el).textContent = post.caption;
    $(".copy", el).onclick = () => copyCaption(post.caption);
    $(".share", el).onclick = () => send(post);
    list.appendChild(el);
    preload(post, $(".share", el));
  }
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

fetch("posts.json?" + Date.now()).then((r) => r.ok ? r.json() : []).then(render).catch(() => render([]));
</script>
</body>
</html>
